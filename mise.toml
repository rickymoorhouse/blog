[tools]
hugo-extended-withdeploy = "0.163.3"
python = "3.13"
jq = "1.8.1"

[tasks.build]
description = "Build and validate the Hugo site"
run = "./scripts/build.sh"

[tasks.validate]
description = "Run the site validation suite"
run = "python3 scripts/validate.py"

[tasks."pre-commit-install"]
description = "Install pre-commit hook for site validation"
run = "git config core.hooksPath .githooks && chmod +x .githooks/pre-commit"
