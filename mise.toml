[tools]
hugo-extended-withdeploy = "0.163.3"
python = "3.13"
jq = "1.8.1"

[tasks.build]
description = "Build and validate the Hugo site"
run = "./scripts/build.sh"

[tasks.serve]
description = "Run the Hugo dev server, reachable from other machines on the network"
# Bind to all interfaces; baseURL uses this machine's hostname so links work from elsewhere.
# Extra flags pass through, e.g. `mise run serve -- --port 1314`
run = 'hugo server --bind 0.0.0.0 --baseURL "http://$(hostname)/"'

[tasks.validate]
description = "Run the site validation suite"
run = "python3 scripts/validate.py"

[tasks.check-blogroll]
description = "Check blogroll feeds and sites for broken links"
run = "python3 scripts/check_blogroll.py"

[tasks."pre-commit-install"]
description = "Install pre-commit hook for site validation"
run = "git config core.hooksPath .githooks && chmod +x .githooks/pre-commit"
