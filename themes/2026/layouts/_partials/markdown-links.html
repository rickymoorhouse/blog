{{- /* Low-key link to the page's Markdown version, plus a copy button when the Clipboard API is available. */ -}}
{{ with .OutputFormats.Get "markdown" }}
<p class="post-meta markdown-links">
    <a href="{{ .RelPermalink }}" type="text/markdown">Markdown</a>
    <span class="copy-markdown-wrap" hidden>· <button type="button" class="copy-markdown" data-src="{{ .RelPermalink }}">Copy as Markdown</button></span>
</p>
<script>
(function () {
    var btn = document.querySelector('.copy-markdown');
    if (!btn || !navigator.clipboard || !window.fetch) return;
    btn.parentNode.hidden = false;
    btn.addEventListener('click', function () {
        var text = fetch(btn.dataset.src)
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
        // ClipboardItem with a promise keeps Safari's user-gesture check happy across the fetch
        (window.ClipboardItem && navigator.clipboard.write
            ? navigator.clipboard.write([new ClipboardItem({ 'text/plain': text.then(function (t) { return new Blob([t], { type: 'text/plain' }); }) })])
            : text.then(function (t) { return navigator.clipboard.writeText(t); }))
            .then(function () { btn.textContent = 'Copied'; },
                  function () { btn.textContent = 'Copy failed'; })
            .finally(function () { setTimeout(function () { btn.textContent = 'Copy as Markdown'; }, 2000); });
    });
})();
</script>
{{ end }}
