{{ partial "header" . }}
<main class="{{ .Type }} shows" data-pagefind-body>
    <article>
    {{ partial "item-header" . }}
    <br> <div class="text-left">{{ .Content }}</div>
    {{ with .Resources.ByType "image" }}
      {{ range . }}
        {{ $title := "" }}
        {{ $exif_stats := "" }}
          <a class="glightbox" data-title="{{ $.Scratch.Get "title" }}" href="{{ .RelPermalink }}">
            <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" loading="lazy" decoding="async" alt="{{ $.Scratch.Get "title" }}" />
          </a>
      {{ end }}
    {{ end }}
</article>
</main>
{{ partial "footer.html" . }}
