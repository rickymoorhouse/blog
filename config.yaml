baseURL: "https://rickymoorhouse.uk/"
locale: "en-gb"
title: "Ricky Moorhouse"
theme: "2026"
permalinks:
  blog: "/blog/:year/:slug/"
  microblog: "/microblog/:slugorcontentbasename/"
params:
    author: "Ricky Moorhouse"
    description: "I’m a Technical Product Manager at IBM working on API Connect, with a background in integration, SRE and architecture. Outside of work, I enjoy spending time with family, walking with the dog and being behind a camera. Welcome to my corner of the web - I hope you find something interesting or useful here."
    # Short version (under 160 characters) for <meta name="description"> and og:description
    metaDescription: "Ricky Moorhouse’s personal site: a mixture of content across APIs, SRE, observability, AI agents, travel, and photography."
    githubUsername: "rickymoorhouse"
    build: "main"
    mainSections: ["blog", "flights", "talks", "projects", "photos", "microblog", "shows"]
    dateFormat: "2 Jan 2006"
    images: ["images/siteicon.png"]
    font: "IBM Plex Sans" # should match the name on Google Fonts!
    copyright: "&copy; Ricky Moorhouse"
    contactURL: "https://letterbird.co/rickymoorhouse"
    highlight: true
    highlightLanguages: ["python", "javascript", "yaml"]
    mapboxAccessToken: "pk.eyJ1Ijoicmlja3ltb29yaG91c2UiLCJhIjoiY21vcmN6cWJ0MXBtbzJzczR2cHNhN2lpZiJ9.UgJJKGt2mZMkN-LcW-1tug"
    mapboxVersion: "3.28.1"
menu:
  icon:
  - url: "https://github.com/rickymoorhouse/"
    name: "github"
    title: "GitHub"
    weight: 4
  - url: "https://bsky.app/profile/rickymoorhouse.uk"
    name: "bluesky"
    title: "Bluesky"
    weight: 2
  - url: "https://sifa.id/p/rickymoorhouse.uk?connect=1"
    name: "sifa"
    title: "Sifa"
    weight: 3
  - url: "https://www.threads.com/@rickymoorhouse"
    name: "threads"
    title: "Threads"
    weight: 3    
  - url: "https://www.linkedin.com/in/rickymoorhouse/"
    name: "linkedin"
    title: "LinkedIn"
    weight: 1
  - url: "https://www.instagram.com/rickymoorhouse/"
    name: "instagram"
    title: "Instagram"
    weight: 9
  
languages:
  en:
    params:
      title: "Ricky Moorhouse"
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      typographer: false

deployment:
  order: [".jpg$", ".gif$"]
  target: "bunny"
  workers: 50
  maxDeletes: 2560
  invalidateCDN: false
  targets:
  - name: "bunny"
    url: "s3://rm-uk-blog?region=uk&endpoint=https://uk-s3.storage.bunnycdn.com&awssdk=v2&use_path_style=true&disable_https=false"
  matchers:
    # Cache static assets for 1 year.
  - pattern: "^.+\\.(js|css|svg|ttf)$"
    cacheControl: "max-age=31536000, no-transform, public"
    gzip: false
  - pattern: "^.+\\.(html|xml|json)$"
    gzip: false
mediaTypes:
  application/feed+json:
    suffixes: ["json"]
  text/x-opml:
    suffixes: ["opml"]
outputFormats:
  # Home feeds at /feed.xml and /feed.json; section and taxonomy RSS stay at index.xml
  feedxml:
    mediaType: "application/rss+xml"
    baseName: "feed"
    rel: "alternate"
    noUgly: true
  feedjson:
    mediaType: "application/feed+json"
    baseName: "feed"
    rel: "alternate"
    isPlainText: true
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
  llmsfull:
    mediaType: "text/plain"
    baseName: "llms-full"
    isPlainText: true
    notAlternative: true
  search:
    mediaType: "application/json"
    baseName: "search"
    isPlainText: true
    notAlternative: true
  # followspec list built from data/blogroll.yaml; build.sh moves it to /.well-known/following.opml
  following:
    mediaType: "text/x-opml"
    baseName: "following"
    isPlainText: true
    notAlternative: true
outputs:
  home: ["HTML", "FEEDXML", "MARKDOWN", "FEEDJSON", "LLMS", "LLMSFULL", "SEARCH", "FOLLOWING"]
  page: ["HTML", "MARKDOWN"]
services:
  rss:
    limit: 10
