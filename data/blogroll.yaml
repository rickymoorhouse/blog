# Feeds I follow. Drives the /blogroll/ page and /.well-known/following.opml (followspec).
#
# Each entry:
#   title:       site or feed name (required)
#   xmlUrl:      absolute feed URL, RSS/Atom/JSON Feed (required)
#   htmlUrl:     the site's home page (optional, the blogroll links here, falling back to xmlUrl)
#   description: one line about why it's worth reading (optional)
#   category:    group name (optional, entries without one are listed first)
#
# To import from feed reader OPML exports (de-duplicated, never overwrites entries here):
#   python3 scripts/import_opml.py --dry-run export1.opml export2.opml
#   python3 scripts/import_opml.py export1.opml export2.opml
#
# feeds:
#   - title: "Example Blog"
#     xmlUrl: "https://example.com/feed.xml"
#     htmlUrl: "https://example.com/"
#     description: "Thoughtful posts about APIs."
#     category: "Technical"
