{{ partial "header" . }}
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css" rel="stylesheet" />
  
  <style>
    @media (max-width: 768px) {
      div.page-content {
        float: left;
        width: 100%;
        text-align: left;
        clear: left;
        padding: 0.5em;
      }
      #custom #map {
        height: 40% !important;
        min-height: 200pt;
        margin-top: -20px;
      }
      svg.icon { display: none; }
    }
    @media (min-width: 768px) {
      #map {
          height: 100%;
          margin-top: -20px;
      }
      main {
        margin-top: 0;
      }
      div.page-content {
          position: fixed;
          text-align: left;
          bottom: 4em;
          left: 1em;
          z-index: 999;
          padding: var(--space-xs);
          margin: 0;
          left: calc(100vw - 15em);
          width: 14em;
          background: var(--bg-body);
          color: var(--text-primary);
          padding: var(--space-xs);          
          box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      }
      svg.icon {
        width: 2em;
        height: 2em;
        margin: 0 auto;
        transform: rotate(-90deg);
        display: block;
      }       
    }

    .mapboxgl-popup-content ul {
      margin: 0;padding: 0 0 0 1em;
    }
    @media (prefers-color-scheme: dark) {
      div.page-content {
        color: #ccc;
      }
      .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #222;}
      .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #222;}
      .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #222;}
      .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #222;}
      .mapboxgl-popup-content {
        background: #222;
        color: #ccc;
      }          
    }
    #static { display: none;}

    #custom .page-content h3 {
      margin-bottom: 0;
    }
    #custom ul li {
      font-family: var(--font-sans);
      font-size: var(--text-sm);
    }
    #custom ul {
        margin: 0;
    }
    #custom .text-left {
    margin-left: 50px;
    }

  </style>
    <div class="site" id="custom">
      <div class="site-content" id="map">
      </div>
      <!-- site-content -->
      <div class="page-content" id="summary"><ul>
      {{ .Summary }}
      </div>
    </div>
    <a href="#summary">
      <svg class="icon" viewBox="0 0 7 7" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><path d="M4.928,1.34c-0,0 -0.793,1.484 -0.788,2.029c0.004,0.544 0.78,2.129 0.78,2.129l-2.923,-2.118l2.931,-2.04Z" style="fill:#098;"/></svg>
    </a>
    <main class="blog single" data-pagefind-body="">
    <article class="h-entry">
      <div class="text-left e-content">
        {{ .ContentWithoutSummary }}
      </div>
    </article>
  </main>        
<script type="text/javascript">

document.getElementById('map').style.height=(window.innerHeight-28) + "px";
mapboxgl.accessToken = '{{ .Site.Params.mapboxAccessToken }}';

var style = 'mapbox://styles/mapbox/light-v10';
var currentTheme = document.documentElement.getAttribute('data-theme') || 
                  (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light');
if (currentTheme === 'dark') {
  style = 'mapbox://styles/mapbox/dark-v10'
}

// Function to update map style based on theme
function updateMapTheme(theme) {
  var newStyle = theme === 'dark' ? 'mapbox://styles/mapbox/dark-v10' : 'mapbox://styles/mapbox/light-v10';
  if (map.getStyle() !== newStyle) {
    map.setStyle(newStyle);
    // Re-add layers after style reload
    setTimeout(function() {
      map.addSource('points', {
        type: 'geojson', 
        data: geojsonPoints,
        cluster: false,
      });
      map.addLayer({
        id: 'points',
        type: 'circle',
        source: 'points',
        paint: {
          'circle-color': '#cc9966',
          'circle-radius': 6,
        }
      });
      {{ if .Params.geojsonLines }}
      addLines(map);
      {{ end }}  

    }, 1000);
  }
}

// Listen for theme changes
var themeObserver = new MutationObserver(function(mutations) {
  mutations.forEach(function(mutation) {
    if (mutation.attributeName === 'data-theme') {
      var theme = document.documentElement.getAttribute('data-theme');
      if (theme) {
        updateMapTheme(theme);
      }
    }
  });
});
themeObserver.observe(document.documentElement, { attributes: true });

{{ if .Params.geojson }}
const geojsonPoints = {{ .Params.geojson }};
{{ end }}
{{ if .Params.geojsonLines }}
const geojsonLines = {{ .Params.geojsonLines }};
{{ end }}
var map = new mapboxgl.Map({
  container: 'map', // container id
  style: style, // stylesheet location
  center: [{{ .Params.lng }}, {{ .Params.lat }}], // starting position [lng, lat]
  zoom: {{ .Params.zoom }} // starting zoom
});

function addLines(map) {
  map.addSource('lines', {
    type: 'geojson', 
    data: geojsonLines,
    cluster: false,
    })
  map.addLayer({
    id: 'lines',
    type: 'line',
    source: 'lines',
    paint: {
      'line-color': '#0099cc',
      'line-width': 2,
    }
  });
}

map.scrollZoom.disable();
map.on('load', function() {
  {{ if .Params.geojsonLines }}
  addLines(map);
  {{ end }}  

  map.addSource('points', {
    type: 'geojson', 
    data: geojsonPoints,
    cluster: false,
    })
  map.addLayer({
    id: 'points',
    type: 'circle',
    source: 'points',
    paint: {
      'circle-color': '#cc9966',
      'circle-radius': 6,
    }
  });

  var popup = new mapboxgl.Popup({closeButton: true, closeOnClick: true});

  map.on('mouseenter', 'points', function(e) {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('click', 'points', function(e) {
    var coordinates = e.features[0].geometry.coordinates.slice();
    var content = e.features[0].properties.content;
  
    popup.setLngLat(coordinates)
      .setHTML(content)
      .addTo(map);
  });
  map.on('mouseleave', 'places', function() {
      map.getCanvas().style.cursor = '';
      popup.remove();
  });

});

</script>
{{ partial "footer" . }}
