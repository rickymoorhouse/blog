repos:
  - repo: local
    hooks:
      - id: site-validation
        name: Site Validation Suite
        entry: scripts/validate.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [commit]
        description: >
          Validates site: JSON feeds, flights vs content, 
          HTML conformance, structured data, source data integrity.
        exit_type: exit-code
        always_run: true
        verbose: true
